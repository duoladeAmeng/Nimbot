[project]
name = "duolaAgent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "dotenv>=0.9.9",
    "httpx>=0.28,<1",
    "jinja2>=3.1.0",
    "loguru>=0.7,<1",
    "mcp>=2.1.1",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.12.0,<3.0.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]
[project.scripts]
duolaAgent = "duolaAgent.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N999"] # Keep the established duolaAgent package spelling.

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9",
]
